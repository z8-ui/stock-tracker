{% extends "base.html" %}
{% block title %}AI 分析{% endblock %}

{% block content %}
<!-- ========== 搜索区 ========== -->
<div class="row">
    <div class="col" style="flex:2">
        <div class="card">
            <div class="card-header">AI 技术分析（K线 + 指标 + 大模型）</div>
            <div class="search-bar">
                <input type="text" id="ai-stock-search" placeholder="输入股票名称或代码，如 中钨高新 / 00700 / AAPL（支持A股/港股/美股/指数/基金）" class="search-input" onkeydown="if(event.key==='Enter')searchAiStock()">
                <button onclick="searchAiStock()" class="btn">搜索</button>
            </div>
            <div id="ai-search-results" class="search-results"></div>
        </div>
    </div>
    <div class="col" style="flex:1">
        <div class="card">
            <div class="card-header">搜索历史</div>
            <div id="ai-search-history" class="chip-group"><p class="hint">暂无</p></div>
        </div>
    </div>
</div>

<!-- ========== 当前分析标的横幅 ========== -->
<div class="card" id="ai-stock-banner" style="display:none; border-left:4px solid #ffb74d;">
    <div class="card-header">
        <span id="ai-stock-name" style="font-size:16px; font-weight:bold;"></span>
        <span id="ai-stock-code" style="color:#8892b0; margin-left:8px;"></span>
        <span id="ai-stock-tag" style="margin-left:8px; font-size:12px;"></span>
    </div>
</div>

<!-- ========== 指标卡片 ========== -->
<div class="row" id="ai-indicator-row" style="display:none;">
    <div class="col"><div class="card"><div class="card-header">最新行情</div><div id="ai-quote" class="summary-box"></div></div></div>
    <div class="col"><div class="card"><div class="card-header">均线 MA</div><div id="ai-ma" class="summary-box"></div></div></div>
    <div class="col"><div class="card"><div class="card-header">MACD / RSI</div><div id="ai-macd" class="summary-box"></div></div></div>
    <div class="col"><div class="card"><div class="card-header">量能</div><div id="ai-volume" class="summary-box"></div></div></div>
</div>

<div class="card" id="ai-fib-card" style="display:none;">
    <div class="card-header">斐波那契回调位（近20日）</div>
    <div id="ai-fib" class="summary-box"></div>
</div>

<!-- ========== AI 分析文本 ========== -->
<div class="card">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
        <span>AI 分析报告</span>
        <button id="ai-refresh-btn" class="btn" style="display:none;" onclick="refreshAiAnalysis()">🔄 重新分析</button>
    </div>
    <div id="ai-analysis-box" class="summary-box">
        <p class="hint">搜索并选择一只股票开始分析（支持 A股/港股/指数/基金，美股暂不支持）。分析基于真实K线数据 + 技术指标，由大模型生成，仅供参考，不构成投资建议。</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ========== 搜索历史 ==========
function getAiHistory() {
    try { return JSON.parse(localStorage.getItem('aiSearchHistory') || '[]'); } catch(e) { return []; }
}
function addAiHistory(code, name, market, tag) {
    var h = getAiHistory();
    h = h.filter(function(i) { return i.code !== code; });
    h.unshift({code: code, name: name, market: market || '', tag: tag || ''});
    if (h.length > 10) h = h.slice(0, 10);
    localStorage.setItem('aiSearchHistory', JSON.stringify(h));
    renderAiHistory();
}
function renderAiHistory() {
    var h = getAiHistory();
    var el = document.getElementById('ai-search-history');
    if (!h.length) { el.innerHTML = '<p class="hint">暂无</p>'; return; }
    el.innerHTML = h.map(function(i) {
        var tag = i.tag ? ' <span style="color:#8892b0;font-size:11px;">[' + i.tag + ']</span>' : '';
        return '<button class="chip" onclick="loadAiAnalysis(\'' + i.code + '\',\'' + String(i.name).replace(/'/g, "\\'") + '\',\'' + (i.market || '') + '\',\'' + (i.tag || '') + '\')">' + i.name + tag + '</button>';
    }).join('');
}

// ========== 搜索（全市场: A股/港股/美股/指数/基金） ==========
function searchAiStock() {
    var q = document.getElementById('ai-stock-search').value;
    if (!q) return;
    fetch('/api/search-stock?q=' + encodeURIComponent(q))
        .then(function(r) { return r.json(); })
        .then(function(res) {
            var el = document.getElementById('ai-search-results');
            if (res.code !== 200 || !res.data || !res.data.length) {
                el.innerHTML = '<p class="hint">未找到匹配的股票</p>';
                return;
            }
            el.innerHTML = res.data.map(function(s) {
                return '<button class="chip" onclick="loadAiBySearch(\'' + s.code + '\',\'' + String(s.name).replace(/'/g, "\\'") + '\',\'' + (s.market || '') + '\',\'' + (s.tag || '') + '\')">' + s.name + ' (' + s.code + ') <span style="color:#8892b0;font-size:11px;">[' + s.tag + ']</span></button>';
            }).join('');
        });
}
function loadAiBySearch(code, name, market, tag) {
    loadAiAnalysis(code, name, market, tag);
    document.getElementById('ai-search-results').innerHTML = '';
    document.getElementById('ai-stock-search').value = name + ' (' + code + ')';
}

// ========== 分析 ==========
var currentStock = null;  // {code, name, market, tag} 当前分析的股票

function loadAiAnalysis(code, name, market, tag, refresh) {
    currentStock = {code: code, name: name, market: market || '', tag: tag || ''};
    addAiHistory(code, name, market, tag);
    // 顶部横幅: 显示当前分析的股票名称
    var banner = document.getElementById('ai-stock-banner');
    banner.style.display = 'block';
    document.getElementById('ai-stock-name').textContent = name;
    document.getElementById('ai-stock-code').textContent = code;
    document.getElementById('ai-stock-tag').textContent = tag ? '[' + tag + ']' : '';

    var box = document.getElementById('ai-analysis-box');
    document.getElementById('ai-indicator-row').style.display = 'none';
    document.getElementById('ai-fib-card').style.display = 'none';
    document.getElementById('ai-refresh-btn').style.display = 'none';

    // 美股暂不支持（K线数据源限制）
    if (market === 'us') {
        box.innerHTML = '<p style="color:#ef5350;">美股暂不支持 AI 技术分析（K线数据源限制），可搜索 A股/港股/指数/基金。</p>';
        return;
    }

    box.innerHTML = refresh
        ? '<p class="loading-hint">AI 分析中（重新生成报告，约10-30秒）...</p>'
        : '<p class="loading-hint">AI 分析中（拉取K线 + 计算指标 + 大模型生成，约10-30秒）...</p>';

    var url = '/api/ai-analysis?code=' + code + '&name=' + encodeURIComponent(name);
    if (market) url += '&market=' + encodeURIComponent(market);
    if (refresh) url += '&refresh=1';
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code !== 200) {
                box.innerHTML = '<p style="color:#ef5350;">' + res.msg + '</p>';
                return;
            }
            var d = res.data;
            renderIndicators(d.indicators);
            box.innerHTML = renderAnalysisText(d.analysis);
            // 缓存/时间信息
            var today = new Date().toISOString().slice(0, 10);
            var meta = '';
            if (d.cached) {
                meta = '<p style="color:#8892b0;font-size:12px;margin-bottom:8px;">⚡ 历史结论（缓存）· 分析于 ' +
                    (d.cached_at || '-') + ' · 数据截至 ' + (d.kline_date || '-');
                if (d.kline_date && d.kline_date < today) {
                    meta += ' <span style="color:#ffb74d;">行情已更新，建议点右上角重新分析</span>';
                }
                meta += '</p>';
            } else {
                meta = '<p style="color:#26a69a;font-size:12px;margin-bottom:8px;">✅ 最新结论 · 数据截至 ' +
                    (d.kline_date || '-') + '（' + (d.cached_at || '刚刚') + '）</p>';
            }
            box.innerHTML = meta + box.innerHTML;
            document.getElementById('ai-refresh-btn').style.display = 'inline-block';
        })
        .catch(function(err) {
            box.innerHTML = '<p style="color:#ef5350;">请求失败: ' + err + '</p>';
        });
}

// ========== 强制重新分析 ==========
function refreshAiAnalysis() {
    if (!currentStock) return;
    loadAiAnalysis(currentStock.code, currentStock.name, currentStock.market, currentStock.tag, true);
}

// ========== 指标渲染 ==========
function renderIndicators(ind) {
    document.getElementById('ai-indicator-row').style.display = 'flex';
    document.getElementById('ai-fib-card').style.display = 'block';

    var chgColor = ind.chg_pct >= 0 ? '#ef5350' : '#26a69a';
    document.getElementById('ai-quote').innerHTML =
        '<div class="summary-row"><span class="label">收盘价</span><span class="value">' + ind.price + '</span></div>' +
        '<div class="summary-row"><span class="label">当日涨跌</span><span class="value" style="color:' + chgColor + ';">' + (ind.chg_pct >= 0 ? '+' : '') + ind.chg_pct + '%</span></div>' +
        '<div class="summary-row"><span class="label">日期</span><span class="value">' + ind.date + '</span></div>';

    document.getElementById('ai-ma').innerHTML =
        '<div class="summary-row"><span class="label">MA5</span><span class="value">' + ind.ma5 + '</span></div>' +
        '<div class="summary-row"><span class="label">MA10</span><span class="value">' + ind.ma10 + '</span></div>' +
        '<div class="summary-row"><span class="label">MA20</span><span class="value">' + ind.ma20 + '</span></div>' +
        '<div class="summary-row"><span class="label">MA60</span><span class="value">' + ind.ma60 + '</span></div>';

    var macdColor = ind.macd_hist >= 0 ? '#ef5350' : '#26a69a';
    var rsiColor = ind.rsi14 > 70 ? '#ef5350' : (ind.rsi14 < 30 ? '#26a69a' : '#ffb74d');
    document.getElementById('ai-macd').innerHTML =
        '<div class="summary-row"><span class="label">DIF</span><span class="value">' + ind.macd_dif + '</span></div>' +
        '<div class="summary-row"><span class="label">DEA</span><span class="value">' + ind.macd_dea + '</span></div>' +
        '<div class="summary-row"><span class="label">MACD柱</span><span class="value" style="color:' + macdColor + ';">' + ind.macd_hist + '</span></div>' +
        '<div class="summary-row"><span class="label">RSI14</span><span class="value" style="color:' + rsiColor + ';">' + ind.rsi14 + (ind.rsi14 > 70 ? ' (超买)' : (ind.rsi14 < 30 ? ' (超卖)' : '')) + '</span></div>';

    var volColor = ind.vol_ratio >= 1.2 ? '#ef5350' : (ind.vol_ratio <= 0.8 ? '#26a69a' : '#ffb74d');
    document.getElementById('ai-volume').innerHTML =
        '<div class="summary-row"><span class="label">5日均量</span><span class="value">' + (ind.vol_ma5 / 10000).toFixed(1) + '万手</span></div>' +
        '<div class="summary-row"><span class="label">20日均量</span><span class="value">' + (ind.vol_ma20 / 10000).toFixed(1) + '万手</span></div>' +
        '<div class="summary-row"><span class="label">量比</span><span class="value" style="color:' + volColor + ';">' + ind.vol_ratio + (ind.vol_ratio >= 1.2 ? ' (放量)' : (ind.vol_ratio <= 0.8 ? ' (缩量)' : ' (平量)')) + '</span></div>' +
        '<div class="summary-row"><span class="label">近20日</span><span class="value">涨' + ind.up_days_20 + '天 / 跌' + ind.down_days_20 + '天</span></div>';

    var fib = ind.fib;
    document.getElementById('ai-fib').innerHTML =
        '<p><b>近20日高点：</b>' + ind.high_20 + ' &nbsp; <b>低点：</b>' + ind.low_20 + '</p>' +
        Object.keys(fib.levels).sort(function(a,b){ return parseFloat(b) - parseFloat(a); }).map(function(k) {
            var near = Math.abs(ind.price - fib.levels[k]) / fib.levels[k] < 0.02;
            return '<span class="chip" style="' + (near ? 'background:#ffb74d;color:#fff;' : '') + '">Fib ' + k + ': ' + fib.levels[k] + (near ? ' ← 当前附近' : '') + '</span>';
        }).join(' ');
}

// ========== 文本渲染(简单 markdown) ==========
function renderAnalysisText(text) {
    var html = String(text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/^---+$/gm, '<hr style="border-color:#233054;">')
        .replace(/\n/g, '<br>');
    return '<div style="line-height:1.9;font-size:14px;">' + html + '</div>' +
           '<p style="color:#8892b0;font-size:12px;margin-top:12px;">* 本报告由 AI 基于技术指标生成，仅供学习参考，不构成投资建议。</p>';
}

// 默认加载历史
document.addEventListener('DOMContentLoaded', renderAiHistory);
</script>
{% endblock %}
